spring:
  application:
    name: notification_service

  datasource:
    url: jdbc:mysql://salonmanagement-mysql-salonmanagement112026.g.aivencloud.com:27506/notification_db
    username: avnadmin
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notificationservice

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.type.mapping: customerCreatedEvent:com.salon.notification_service.dto.eventDto.CustomerCreatedEvent,inventoryEvent:com.salon.notification_service.dto.eventDto.InventoryEvent
        spring.json.trusted.packages: com.salon.notification_service.dto.eventDto

server:
  port: 8084